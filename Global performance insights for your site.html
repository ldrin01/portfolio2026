y></table></details> </div></div></div><div class="lh-audit-group">  <details class="lh-clump lh-clump--passed"> <summary> <div class="lh-audit-group__summary"> <div class="lh-audit-group__header"> <span class="lh-audit-group__title">Passed audits</span> <span class="lh-audit-group__itemcount">(13)</span>   </div> <div class="lh-clump-toggle"> <span class="lh-clump-toggletext--show">Show</span> <span class="lh-clump-toggletext--hide">Hide</span> </div> </div> </summary> <div class="lh-audit lh-audit--binary lh-audit--pass" id="is-on-https"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Uses HTTPS</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>All sites should be protected with HTTPS, even ones that don't handle sensitive data. This includes avoiding <a rel="noopener" target="_blank" href="https://developers.google.com/web/fundamentals/security/prevent-mixed-content/what-is-mixed-content?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">mixed content</a>, where some resources are loaded over HTTP despite the initial request being served over HTTPS. HTTPS prevents intruders from tampering with or passively listening in on the communications between your app and your users, and is a prerequisite for HTTP/2 and many new web platform APIs. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/pwa/is-on-https/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about HTTPS</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="deprecations"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Avoids deprecated APIs</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Deprecated APIs will eventually be removed from the browser. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/best-practices/deprecations/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about deprecated APIs</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="third-party-cookies"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Avoids third-party cookies</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Third-party cookies may be blocked in some contexts. <a rel="noopener" target="_blank" href="https://privacysandbox.google.com/cookies/prepare/overview">Learn more about preparing for third-party cookie restrictions</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="paste-preventing-inputs"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Allows users to paste into input fields</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Preventing input pasting is a bad practice for the UX, and weakens security by blocking password managers.<a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/best-practices/paste-preventing-inputs/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about user-friendly input fields</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="geolocation-on-start"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Avoids requesting the geolocation permission on page load</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Users are mistrustful of or confused by sites that request their location without context. Consider tying the request to a user action instead. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/best-practices/geolocation-on-start/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about the geolocation permission</a>. Also consider using the <a rel="noopener" target="_blank" href="https://developer.chrome.com/blog/geolocation-html-element?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics"><span><code>&lt;geolocation&gt;</code> element</span></a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="notification-on-start"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Avoids requesting the notification permission on page load</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Users are mistrustful of or confused by sites that request to send notifications without context. Consider tying the request to user gestures instead. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/best-practices/notificati
