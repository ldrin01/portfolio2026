 content.</span></div></div><div class="lh-audit-group">  <details class="lh-clump lh-clump--manual"> <summary> <div class="lh-audit-group__summary"> <div class="lh-audit-group__header"> <span class="lh-audit-group__title">Additional items to manually check</span> <span class="lh-audit-group__itemcount">(10)</span>   </div> <div class="lh-clump-toggle"> <span class="lh-clump-toggletext--show">Show</span> <span class="lh-clump-toggletext--hide">Hide</span> </div> </div> </summary> <div class="lh-audit lh-audit--manual lh-audit--pass" id="focusable-controls"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Interactive controls are keyboard focusable</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Custom interactive controls are keyboard focusable and display a focus indicator. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/focusable-controls/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn how to make custom controls focusable</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--manual lh-audit--pass" id="interactive-element-affordance"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Interactive elements indicate their purpose and state</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Interactive elements, such as links and buttons, should indicate their state and be distinguishable from non-interactive elements. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/interactive-element-affordance/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn how to decorate interactive elements with affordance hints</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--manual lh-audit--pass" id="logical-tab-order"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>The page has a logical tab order</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Tabbing through the page follows the visual layout. Users cannot focus elements that are offscreen. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/logical-tab-order/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about logical tab ordering</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--manual lh-audit--pass" id="visual-order-follows-dom"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Visual order on the page follows DOM order</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>DOM order matches the visual order, improving navigation for assistive technology. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/visual-order-follows-dom/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about DOM and visual ordering</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--manual lh-audit--pass" id="focus-traps"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>User focus is not accidentally trapped in a region</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>A user can tab into and out of any control or region without accidentally trapping their focus. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/focus-traps/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn how to avoid focus traps</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--manual lh-audit--pass" id="managed-focus"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>The user's focus is directed to new content added to the page</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>If new content, such as a dialog, is added to the page, the user's focus is directed to it. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/managed-focus/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn how to direct focus to new content</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--manual lh-audit--pass" id="use-landmarks"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>HTML5 landmark elements are used to improve navigation</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>Landmark elements (<code>&lt;main&gt;</code>, <code>&lt;nav&gt;</code>, etc.) are used to improve the keyboard navigation of the page for assistive technology. </span><a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/use-landmarks/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about landmark elements</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--manual lh-audit--pass" id="offscreen-content-hidden"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Offscreen content is hidden from assistive technology</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Offscreen content is hidden with display: none or aria-hidden=true. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/offscreen-content-hidden/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn how to properly hide offscreen content</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--manual lh-audit--pass" id="custom-controls-labels"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Custom controls have associated labels</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Custom interactive controls have associated labels, provided by aria-label or aria-labelledby. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/custom-controls-labels/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about custom controls and labels</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--manual lh-audit--pass" id="custom-controls-roles"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Custom controls have ARIA roles</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Custom interactive controls have appropriate ARIA roles. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/accessibility/custom-control-roles/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn how to add roles to custom controls</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div></details> <span class="lh-audit-group__description lh-audit-group__footer">These items address areas which an automated testing tool cannot cover. Learn more in our guide on <a rel="noopener" target="_blank" href="https://web.dev/articles/how-to-review?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">conducting an accessibility review</a>.</span></div><div class="lh-audit-group">  <details class="lh-clump lh-clump--passed"> <summary> <div class="lh-audit-group__summary"> <div class="lh-audit-group__header"> <span class="lh-audit-group__title">Passed audits</span> <span class="lh-audit-group__itemcount">(23)</span>   </div> <div class="lh-clump-toggle"> <span class="lh-clump-toggletext--show">Show</span> <span class="lh-clump-toggletext--hide">Hide</span> </div> </div> </summary> <div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-allowed-attr"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[aria-*]</code> attributes match their roles</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>Each ARIA <code>role</code> supports a specific subset of <code>aria-*</code> attributes. Mismatching these invalidates the <code>aria-*</code> attributes. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-allowed-attr">Learn how to match ARIA attributes to their roles</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-hidden-body"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[aria-hidden="true"]</code> is not present on the document <code>&lt;body&gt;</code></span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>Assistive technologies, like screen readers, work inconsistently when <code>aria-hidden="true"</code> is set on the document <code>&lt;body&gt;</code>. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-hidden-body"><span>Learn how <code>aria-hidden</code> affects the document body</span></a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-required-attr"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[role]</code>s have all required <code>[aria-*]</code> attributes</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Some ARIA roles have required attributes that describe the state of the element to screen readers. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-required-attr">Learn more about roles and required attributes</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-roles"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[role]</code> values are valid</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>ARIA roles must have valid values in order to perform their intended accessibility functions. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-roles">Learn more about valid ARIA roles</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-valid-attr-value"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[aria-*]</code> attributes have valid values</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Assistive technologies, like screen readers, can't interpret ARIA attributes with invalid values. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-valid-attr-value">Learn more about valid values for ARIA attributes</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-valid-attr"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[aria-*]</code> attributes are valid and not misspelled</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Assistive technologies, like screen readers, can't interpret ARIA attributes with invalid names. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-valid-attr">Learn more about valid ARIA attributes</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="button-name"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Buttons have an accessible name</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>When a button doesn't have an accessible name, screen readers announce it as "button", making it unusable for users who rely on screen readers. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/button-name">Learn how to make buttons more accessible</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="image-alt"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Image elements have <code>[alt]</code> attributes</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Informative elements should aim for short, descriptive alternate text. Decorative elements can be ignored with an empty alt attribute. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/image-alt"><span>Learn more about the <code>alt</code> attribute</span></a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="meta-viewport"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[user-scalable="no"]</code> is not used in the <code>&lt;meta name="viewport"&gt;</code> element and the <code>[maximum-scale]</code> attribute is not less than 5.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Disabling zooming is problematic for users with low vision who rely on screen magnification to properly see the contents of a web page. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/meta-viewport">Learn more about the viewport meta tag</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-conditional-attr"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>ARIA attributes are used as specified for the element's role</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Some ARIA attributes are only allowed on an element under certain conditions. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-conditional-attr">Learn more about conditional ARIA attributes</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-hidden-focus"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[aria-hidden="true"]</code> elements do not contain focusable descendents</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>Focusable descendents within an <code>[aria-hidden="true"]</code> element prevent those interactive elements from being available to users of assistive technologies like screen readers. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-hidden-focus"><span>Learn how <code>aria-hidden</code> affects focusable elements</span></a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-prohibited-attr"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Elements use only permitted ARIA attributes</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Using ARIA attributes in roles where they are prohibited can mean that important information is not communicated to users of assistive technologies. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-prohibited-attr">Learn more about prohibited ARIA roles</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="document-title"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Document has a <code>&lt;title&gt;</code> element</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>The title gives screen reader users an overview of the page, and search engine users rely on it heavily to determine if a page is relevant to their search. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/document-title">Learn more about document titles</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="html-has-lang"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>&lt;html&gt;</code> element has a <code>[lang]</code> attribute</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>If a page doesn't specify a <code>lang</code> attribute, a screen reader assumes that the page is in the default language that the user chose when setting up the screen reader. If the page isn't actually in the default language, then the screen reader might not announce the page's text correctly. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/html-has-lang"><span>Learn more about the <code>lang</code> attribute</span></a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="html-lang-valid"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>&lt;html&gt;</code> element has a valid value for its <code>[lang]</code> attribute</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Specifying a valid <a rel="noopener" target="_blank" href="https://www.w3.org/International/questions/qa-choosing-language-tags#question">BCP 47 language</a> helps screen readers announce text properly. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/html-lang-valid"><span>Learn how to use the <code>lang</code> attribute</span></a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="link-name"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Links have a discernible name</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Link text (and alternate text for images, when used as links) that is discernible, unique, and focusable improves the navigation experience for screen reader users. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/link-name">Learn how to make links accessible</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="list"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Lists contain only <code>&lt;li&gt;</code> elements and script supporting elements (<code>&lt;script&gt;</code> and <code>&lt;template&gt;</code>).</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Screen readers have a specific way of announcing lists. Ensuring proper list structure aids screen reader output. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/list">Learn more about proper list structure</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="listitem"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>List items (<code>&lt;li&gt;</code>) are contained within <code>&lt;ul&gt;</code>, <code>&lt;ol&gt;</code> or <code>&lt;menu&gt;</code> parent elements</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>Screen readers require list items (<code>&lt;li&gt;</code>) to be contained within a parent <code>&lt;ul&gt;</code>, <code>&lt;ol&gt;</code> or <code>&lt;menu&gt;</code> to be announced properly. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/listitem">Learn more about proper list structure</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="target-size"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Touch targets have sufficient size and spacing.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Touch targets with sufficient size and spacing help users who may have difficulty targeting small controls to activate the targets. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/target-size">Learn more about touch targets</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="heading-order"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Heading elements appear in a sequentially-descending order</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Properly ordered headings that do not skip levels convey the semantic structure of the page, making it easier to navigate and understand when using assistive technologies. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/heading-order">Learn more about heading order</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="landmark-one-main"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Document has a main landmark.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>One main landmark helps screen reader users navigate a web page. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/landmark-one-main">Learn more about landmarks</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="aria-deprecated-role"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Deprecated ARIA roles were not used</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Deprecated ARIA roles may not be processed correctly by assistive technology. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-deprecated-role">Learn more about deprecated ARIA roles</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div><div class="lh-audit lh-audit--binary lh-audit--pass" id="presentation-role-conflict"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Elements with <code>role="none"</code> or <code>role="presentation"</code> do not have conflicts</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>There are certain cases where the semantic role of an element with <code>role="none"</code> or <code>role="presentation"</code> does not resolve to none or presentation. To ensure the element remains removed from the accessibility tree, you should not add any global ARIA attributes to the element or make it focusable. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/presentation-role-conflict">Learn more about presentation role conflict</a>.</span></div> <div class="lh-audit__stackpacks"></div> <span class="lh-details"></span></details> </div></details> </div><div class="lh-audit-group">  <details class="lh-clump lh-clump--notapplicable"> <summary> <div class="lh-audit-group__summary"> <div class="lh-audit-group__header"> <span class="lh-audit-group__title">Not applicable</span> <span class="lh-audit-group__itemcount">(39)</span>   </div> <div class="lh-clump-toggle"> <span class="lh-clump-toggletext--show">Show</span> <span class="lh-clump-toggletext--hide">Hide</span> </div> </div> </summary> <div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="accesskeys"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[accesskey]</code> values are unique</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Access keys let users quickly focus a part of the page. For proper navigation, each access key must be unique. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/accesskeys">Learn more about access keys</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="aria-command-name"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>button</code>, <code>link</code>, and <code>menuitem</code> elements have accessible names</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>When an element doesn't have an accessible name, screen readers announce it with a generic name, making it unusable for users who rely on screen readers. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-command-name">Learn how to make command elements more accessible</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="aria-dialog-name"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Elements with <code>role="dialog"</code> or <code>role="alertdialog"</code> have accessible names.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>ARIA dialog elements without accessible names may prevent screen readers users from discerning the purpose of these elements. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-dialog-name">Learn how to make ARIA dialog elements more accessible</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="aria-input-field-name"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>ARIA input fields have accessible names</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>When an input field doesn't have an accessible name, screen readers announce it with a generic name, making it unusable for users who rely on screen readers. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-input-field-name">Learn more about input field labels</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="aria-meter-name"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>ARIA <code>meter</code> elements have accessible names</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>When a meter element doesn't have an accessible name, screen readers announce it with a generic name, making it unusable for users who rely on screen readers. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-meter-name"><span>Learn how to name <code>meter</code> elements</span></a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="aria-progressbar-name"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>ARIA <code>progressbar</code> elements have accessible names</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>When a <code>progressbar</code> element doesn't have an accessible name, screen readers announce it with a generic name, making it unusable for users who rely on screen readers. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-progressbar-name"><span>Learn how to label <code>progressbar</code> elements</span></a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="aria-required-children"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Elements with an ARIA <code>[role]</code> that require children to contain a specific <code>[role]</code> have all required children.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh ave associated label elements.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Form elements without effective labels can create frustrating experiences for screen reader users. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/select-name"><span>Learn more about the <code>select</code> element</span></a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="skip-link"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Skip links are focusable.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Including a skip link can help users skip to the main content to save time. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/skip-link">Learn more about skip links</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="tabindex"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>No element has a <code>[tabindex]</code> value greater than 0</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>A value greater than 0 implies an explicit navigation ordering. Although technically valid, this often creates frustrating experiences for users who rely on assistive technologies. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/tabindex"><span>Learn more about the <code>tabindex</code> attribute</span></a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="td-headers-attr"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Cells in a <code>&lt;table&gt;</code> element that use the <code>[headers]</code> attribute refer to table cells within the same table.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>Screen readers have features to make navigating tables easier. Ensuring <code>&lt;td&gt;</code> cells using the <code>[headers]</code> attribute only refer to other cells in the same table may improve the experience for screen reader users. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/td-headers-attr"><span>Learn more about the <code>headers</code> attribute</span></a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="th-has-data-cells"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>&lt;th&gt;</code> elements and elements with <code>[role="columnheader"/"rowheader"]</code> have data cells they describe.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Screen readers have features to make navigating tables easier. Ensuring table headers always refer to some set of cells may improve the experience for screen reader users. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/th-has-data-cells">Learn more about table headers</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="valid-lang"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>[lang]</code> attributes have a valid value</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Specifying a valid <a rel="noopener" target="_blank" href="https://www.w3.org/International/questions/qa-choosing-language-tags#question">BCP 47 language</a> on elements helps ensure that text is pronounced correctly by a screen reader. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/valid-lang"><span>Learn how to use the <code>lang</code> attribute</span></a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="video-caption"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>&lt;video&gt;</code> elements contain a <code>&lt;track&gt;</code> element with <code>[kind="captions"]</code></span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>When a video provides a caption it is easier for deaf and hearing impaired users to access its information. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/video-caption">Learn more about video captions</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="autocomplete-valid"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span><code>autocomplete</code> attributes are used correctly</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>The <code>autocomplete</code> attribute values must be valid and correctly applied for screen readers to function correctly. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/autocomplete-valid">Learn more about valid autocomplete values</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>The summary attribute should describe the table structure, while <code>&lt;caption&gt;</code> should have the onscreen title. Accurate table mark-up helps users of screen readers. </span><a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/table-duplicate-name">Learn more about summary and caption</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="empty-heading"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>All heading elements contain content.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>A heading with no content or inaccessible text prevent screen reader users from accessing information on the page's structure. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/empty-heading">Learn more about headings</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="aria-allowed-role"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Uses ARIA roles only on compatible elements</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Many HTML elements can only be assigned certain ARIA roles. Using ARIA roles where they are not allowed can interfere with the accessibility of the web page. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/aria-allowed-role">Learn more about ARIA roles</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="image-redundant-alt"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Image elements do not have <code>[alt]</code> attributes that are redundant text.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Informative elements should aim for short, descriptive alternative text. Alternative text that is exactly the same as the text adjacent to the link or image is potentially confusing for screen reader users, because the text will be read twice. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/image-redundant-alt"><span>Learn more about the <code>alt</code> attribute</span></a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div><div class="lh-audit lh-audit--notapplicable lh-audit--pass" id="identical-links-same-purpose"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Identical links have the same purpose.</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Links with the same destination should have the same description, to help users understand the link's purpose and decide whether to follow it. <a rel="noopener" target="_blank" href="https://dequeuniversity.com/rules/axe/4.13/identical-links-same-purpose">Learn more about identical links</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> </details> </div></details> </div></div></div><div class="lh-category-wrapper"><div class="lh-category" id="best-practices"><div class="lh-category-header"> <div class="lh-score__gauge" role="heading" aria-level="2"><a class="lh-gauge__wrapper lh-gauge__wrapper--pass">  <div class="lh-gauge__svg-wrapper"> <svg class="lh-gauge" viewBox="0 0 120 120"> <circle class="lh-gauge-base" r="56" cx="60" cy="60" stroke-width="8"></circle> <circle class="lh-gauge-arc" r="56" cx="60" cy="60" stroke-width="8" style="transform: rotate(-87.9537deg); stroke-dasharray: 351.858, 351.858;"></circle> </svg> </div> <div class="lh-gauge__percentage">100</div>  <div class="lh-gauge__label">Best Practices</div> </a></div> <div class="lh-category-header__description"></div> </div><div class="lh-clump--failed"><div class="lh-audit-group lh-audit-group--best-practices-trust-safety"><div class="lh-audit-group__header"><span class="lh-audit-group__title">Trust and Safety</span></div><div class="lh-audit lh-audit--informative" id="csp-xss"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Ensure CSP is effective against XSS attacks</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>A strong Content Security Policy (CSP) significantly reduces the risk of cross-site scripting (XSS) attacks. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/best-practices/csp-xss/?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn how to use a CSP to prevent XSS</a></span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> <table class="lh-table lh-details"><thead><tr><th class="lh-table-column--text"><div class="lh-text">Description</div></th><th class="lh-table-column--code"><div class="lh-text">Directive</div></th><th class="lh-table-column--text"><div class="lh-text">Severity</div></th></tr></thead><tbody><tr class="lh-row--even"><td class="lh-table-column--text"><div class="lh-text">No CSP found in enforcement mode</div></td><td class="lh-table-column--empty"></td><td class="lh-table-column--text"><div class="lh-text">High</div></td></tr></tbody></table></details> </div><div class="lh-audit lh-audit--informative" id="has-hsts"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Use a strong HSTS policy</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>Deployment of the HSTS header significantly reduces the risk of downgrading HTTP connections and eavesdropping attacks. A rollout in stages, starting with a low max-age is recommended. <a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/best-practices/has-hsts?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about using a strong HSTS policy.</a></span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> <table class="lh-table lh-details"><thead><tr><th class="lh-table-column--text"><div class="lh-text">Description</div></th><th class="lh-table-column--code"><div class="lh-text">Directive</div></th><th class="lh-table-column--text"><div class="lh-text">Severity</div></th></tr></thead><tbody><tr class="lh-row--even"><td class="lh-table-column--text"><div class="lh-text">No HSTS header found</div></td><td class="lh-table-column--empty"></td><td class="lh-table-column--text"><div class="lh-text">High</div></td></tr></tbody></table></details> </div><div class="lh-audit lh-audit--informative" id="origin-isolation"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Ensure proper origin isolation with COOP</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span>The Cross-Origin-Opener-Policy (COOP) can be used to isolate the top-level window from other documents such as pop-ups. <a rel="noopener" target="_blank" href="https://web.dev/articles/why-coop-coep?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics#coop">Learn more about deploying the COOP header.</a></span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> <table class="lh-table lh-details"><thead><tr><th class="lh-table-column--text"><div class="lh-text">Description</div></th><th class="lh-table-column--code"><div class="lh-text">Directive</div></th><th class="lh-table-column--text"><div class="lh-text">Severity</div></th></tr></thead><tbody><tr class="lh-row--even"><td class="lh-table-column--text"><div class="lh-text">No COOP header found</div></td><td class="lh-table-column--empty"></td><td class="lh-table-column--text"><div class="lh-text">High</div></td></tr></tbody></table></details> </div><div class="lh-audit lh-audit--informative" id="clickjacking-mitigation"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Mitigate clickjacking with XFO or CSP</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>The <code>X-Frame-Options</code> (XFO) header or the <code>frame-ancestors</code> directive in the <code>Content-Security-Policy</code> (CSP) header control where a page can be embedded. These can mitigate clickjacking attacks by blocking some or all sites from embedding the page. </span><a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/best-practices/clickjacking-mitigation?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about mitigating clickjacking</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> <table class="lh-table lh-details"><thead><tr><th class="lh-table-column--text"><div class="lh-text">Description</div></th><th class="lh-table-column--text"><div class="lh-text">Severity</div></th></tr></thead><tbody><tr class="lh-row--even"><td class="lh-table-column--text"><div class="lh-text">No frame control policy found</div></td><td class="lh-table-column--text"><div class="lh-text">High</div></td></tr></tbody></table></details> </div><div class="lh-audit lh-audit--informative" id="trusted-types-xss"> <details class="lh-expandable-details"> <summary> <div class="lh-audit__header lh-expandable-details__summary"> <span class="lh-audit__score-icon"></span> <span class="lh-audit__title-and-text"> <span class="lh-audit__title"><span>Mitigate DOM-based XSS with Trusted Types</span></span> <span class="lh-audit__display-text"></span> </span> <div class="lh-chevron-container"><svg class="lh-chevron" viewBox="0 0 100 100"> <g class="lh-chevron__lines"> <path class="lh-chevron__line lh-chevron__line-left" d="M10 50h40"></path> <path class="lh-chevron__line lh-chevron__line-right" d="M90 50H50"></path> </g> </svg></div> </div> </summary> <div class="lh-audit__description"><span><span>The <code>require-trusted-types-for</code> directive in the <code>Content-Security-Policy</code> (CSP) header instructs user agents to control the data passed to DOM XSS sink functions. </span><a rel="noopener" target="_blank" href="https://developer.chrome.com/docs/lighthouse/best-practices/trusted-types-xss?utm_source=lighthouse&amp;utm_medium=Lighthouse+Metrics">Learn more about mitigating DOM-based XSS with Trusted Types</a>.</span><span class="lh-audit__adorn" title="This audit does not contribute to the overall category score.">Unscored</span></div> <div class="lh-audit__stackpacks"></div> <table class="lh-table lh-details"><thead><tr><th class="lh-table-column--text"><div class="lh-text">Description</div></th><th class="lh-table-column--text"><div class="lh-text">Severity</div></th></tr></thead><tbody><tr class="lh-row--even"><td class="lh-table-column--text"><div class="lh-text">No `Content-Security-Policy` header with Trusted Types directive found</div></td><td class="lh-table-column--text"><div class="lh-text">High</div></td></tr></tbody></table></details> </div></div><div class="lh-audit-group lh-audit-group--best-practices-browser-compat"><div class="lh-audit-group__header"><span class="lh-audit-group__title">Browser Compatibility</span></div><div class="lh
