<!doctype html>
<html lang="en" data-theme="dark" data-mode="window">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Works Prototype</title>
<link rel="stylesheet" href="/works.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="block logo">logo</div>
    <div class="spacer"></div>
    <div class="block nav">menu</div>
    <div class="block nav">search</div>
  </div>

  <div class="block hero">hero</div>

  <div class="section-label">
    <h2>Works</h2>
  </div>

<section class="win" id="win" aria-label="Works" data-view="icons">
  <aside class="side" id="side"></aside>

  <div class="main">
    <div class="toolbar">
      <button class="pill icon" id="filterBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Show Works filters"><svg viewBox="0 0 12 12"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></button>
      <h3 class="title" id="title"><span id="titleText">All Works</span></h3>
      <div class="spacer"></div>

      <div class="seg" role="group" aria-label="View">
        <button id="vIcons" type="button" aria-pressed="true" aria-label="Icon view"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg></button>
        <button id="vList" type="button" aria-pressed="false" aria-label="List view"><svg viewBox="0 0 16 16"><path d="M5.5 4h8M5.5 8h8M5.5 12h8"/><circle cx="2.5" cy="4" r=".6"/><circle cx="2.5" cy="8" r=".6"/><circle cx="2.5" cy="12" r=".6"/></svg></button>
      </div>

      <div class="menu-wrap">
        <button class="pill" id="sortBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Sort"><span class="sort-label">Sort</span><svg class="chev" viewBox="0 0 12 12"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></button>
        <div class="menu" id="menu" role="menu"></div>
      </div>
    </div>

    <div class="body">
      <div class="canvas" id="canvas"><div class="field" id="field"></div></div>
      <div class="list" id="list" aria-label="Works list"></div>
    </div>

    <div class="statusbar">
      <span id="count">25 items</span>
      <span class="sel" id="selname"></span>
      <button class="linkbtn" id="cleanup" type="button">Clean up <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 2.8L8.6 7.4"/><path d="M7 6.6l2.4 2.4c.3.3.3.8 0 1.1l-3.1 3.3H2.7c1.5-1.4 2-2.9 2-4.4z"/><path d="M5.2 10.6l1.3 1.3"/></svg></button>
    </div>
  </div>
</section>

  <div class="after">
    <div class="block">case studies</div>
    <div class="block">about</div>
    <div class="block">contact</div>
  </div>
</div>

<div class="ql-back" id="qlBack">
  <div class="ql" role="dialog" aria-modal="true" aria-labelledby="qlTitle">
    <div class="ql-top">
      <div class="lights" id="qlLights" role="group" aria-label="Window controls"></div>
      <div class="ql-name" id="qlName"></div>
      <div class="ql-nav"><button class="ql-chev" id="qlPrev" type="button" aria-label="Previous project"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5"/></svg></button><button class="ql-chev" id="qlNext" type="button" aria-label="Next project"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6 4.5 9.5"/></svg></button></div>
    </div>
    <div class="ql-body">
      <div class="ql-main">
        <div class="ql-left">
          <h3 id="qlTitle"></h3>
          <div class="ql-tags" id="qlTags"></div>
          <dl class="ql-facts">
            <div><dt>Client</dt><dd><span id="qlClient"></span><a class="nda" href="/nda-prototype.html">NDA</a></dd></div>
            <div><dt>Role</dt><dd id="qlRole"></dd></div>
            <div><dt>Tools</dt><dd id="qlTool"></dd></div>
          </dl>
        </div>
        <div class="ql-art"><canvas id="qlCanvas" aria-label="50 by 50 light grid. Drag to turn the model." role="img"></canvas></div>
      </div>
      <div class="ql-desc">
        <p id="qlSnippet"></p>
        <div class="note" id="qlNote"></div>
      </div>
      <div class="ql-more" id="qlExtra"></div>
      <button class="pill ql-done" id="qlDone" type="button">Done</button>
    </div>
  </div>
  <div class="ql-mnav"><button type="button" id="qlPrev2" aria-label="Previous project"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5"/></svg></button><button type="button" id="qlNext2" aria-label="Next project"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6 4.5 9.5"/></svg></button></div>
</div>

<button class="theme-toggle" id="theme" type="button">Light mode</button>

<script src="/works-data.js"></script>
<script src="/redact.js"></script>
<script src="/motifs.js"></script>
<script src="/works.js"></script>
</body>
</html>
