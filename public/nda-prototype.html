<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under NDA</title>
<style>
  @font-face { font-family: 'Funnel Display'; src: url('/fonts/funnel-display-latin-wght-normal.woff2') format('woff2'); font-weight: 300 800; font-display: swap; }
  :root { --bg: #0f0f13; --fg: #e6e9ed; --muted: #a8aaaf; --accent: #ff5a2d; --line: rgba(168,170,175,.22); }
  :root[data-theme='light'] { --bg: #f2efe9; --fg: #16161b; --muted: #5d5f66; --accent: #e8471c; --line: rgba(22,22,27,.16); }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: 'Funnel Display', system-ui, sans-serif; display: grid; place-items: center; padding: 24px; }
  main { max-width: 560px; }
  .bar { display: inline-block; background: #000; height: 1.1em; width: 7.5em; border-radius: 3px; vertical-align: -.15em; box-shadow: 0 0 0 1px var(--line); }
  h1 { font-weight: 400; font-size: clamp(34px, 6vw, 56px); line-height: 1.05; letter-spacing: -.02em; margin: 0 0 22px; }
  p { font-size: 18px; line-height: 1.55; color: var(--muted); margin: 0 0 14px; }
  a { color: var(--accent); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Why is this name <span class="bar" aria-hidden="true"></span>?</h1>
  <p>My projects are under NDA. I can show you the work, my role and what I made, but not who it was for.</p>
  <p>The black block is a decoy. There is nothing underneath it, so you won't find a name by looking.</p>
  <p class="mono"><a href="javascript:history.back()">← back to the work</a></p>
</main>
<script>try { var t = localStorage.getItem('works.proto.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</body>
</html>
