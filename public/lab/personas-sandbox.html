<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personas sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap">
<style>
:root { --bg: #0f0f13; --surface: #1a1a20; --fg: #e6e9ed; --muted: #a8aaaf; --accent: #ff5a2d; --line: color-mix(in srgb, #a8aaaf 22%, transparent); --font: 'Funnel Display', system-ui, sans-serif; color-scheme: dark; }
[data-theme="light"] { --bg: #f2efe9; --surface: #fff; --fg: #16161b; --muted: #5d5f66; color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
main { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
.bar { position: fixed; z-index: 10; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar button { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.bar button:hover { border-color: var(--accent); color: var(--accent); }
.bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.bar .sep { width: 1px; height: 22px; background: var(--line); }
.note { position: fixed; left: 16px; bottom: 16px; z-index: 10; margin: 0; font-size: 12px; color: var(--muted); }
/* ---- copied from app/components/HeroPersonas.client.vue ---- */
/* unscoped on purpose: the client-only wrapper means a parent's scoped styles can miss this element, and the
   windows are created in JS. Placement is the old depth portrait's: the head's centre (58.3% across the artwork)
   sits on the right rule-of-thirds line (66.67vw); --s scales it per breakpoint; aspect = the artwork's 970 x 1400. */
.hero-personas {
  --s: 1;
  --h: calc(100vh * var(--s)); --h: calc(100svh * var(--s));
  position: absolute; z-index: 0; bottom: -10%; height: var(--h); aspect-ratio: 970 / 1400;
  left: calc(66.667vw - var(--h) * 0.693 * 0.583);
  pointer-events: none; user-select: none; -webkit-user-select: none;
}
@media (max-width: 1024px) { .hero-personas { --s: .9; } }
@media (max-width: 600px) { .hero-personas { --s: .78; } }

/* handoff: the next style starts its own intro at once, while the last one dissolves on top of it */
.hp-layer { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s .9s, transform .9s ease, filter .9s ease; }
.hp-layer.on { opacity: 1; visibility: visible; transition: opacity .25s ease, visibility 0s; }
.hp-layer.out { z-index: 2; opacity: 0; visibility: visible; mix-blend-mode: screen; transform: scale(1.03); filter: blur(5px); transition: opacity .9s ease, transform .9s cubic-bezier(.3, 0, .2, 1), filter .9s ease, visibility 0s .9s; }
.hp-layer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hp-layer canvas.bleed { left: -10%; top: -10%; width: 120%; height: 120%; } /* room for the plates to drift */
.hp-layer canvas.free { left: -20%; top: -12%; width: 140%; height: 124%; } /* room for the 3D swing */
.hp-layer[data-k="chladni"] { perspective: 1400px; }
.hp-plate { position: absolute; inset: 0; transform-origin: 58% 45%; will-change: transform; }

/* UI/UX: windows, each showing the part of the photo under it */
.hp-wins { pointer-events: none; }
.hp-wins .win { --bar: 24px; position: absolute; left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u) - var(--bar)); width: calc(var(--w) * var(--u)); pointer-events: auto; touch-action: none; cursor: grab;
  background: #1c1c21; border: 1px solid rgba(255, 255, 255, .13); border-radius: 10px; overflow: hidden;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 18px 50px -12px rgba(0, 0, 0, .7), 0 4px 14px rgba(0, 0, 0, .35); will-change: transform; }
.hp-wins .win.drag { cursor: grabbing; box-shadow: 0 30px 70px -10px rgba(0, 0, 0, .85), 0 0 0 1px rgba(255, 90, 45, .5); }
.hp-wins .bar { height: var(--bar); display: flex; align-items: center; gap: 6px; padding: 0 9px; background: linear-gradient(#2a2a31, #24242a); border-bottom: 1px solid rgba(0, 0, 0, .5); }
.hp-wins .bar i { width: 9px; height: 9px; border-radius: 50%; background: #ff5f57; flex: none; }
.hp-wins .bar i:nth-child(2) { background: #febc2e; } .hp-wins .bar i:nth-child(3) { background: #28c840; }
.hp-wins .bar span { flex: 1; text-align: center; margin-right: 33px; font-size: 11px; color: #9a9ca3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp-wins .body { height: calc(var(--h) * var(--u));
  background: var(--photo) no-repeat, repeating-conic-gradient(#202026 0 25%, #1a1a1f 0 50%) 0 0 / 16px 16px;
  background-size: calc(970 * var(--u)) calc(1400 * var(--u)), 16px 16px;
  background-position: calc(var(--x) * var(--u) * -1 - var(--px, 0px)) calc(var(--y) * var(--u) * -1 - var(--py, 0px)), 0 0; }
.hp-wins .panel .body { height: auto; background: #1c1c21; padding: 10px 12px; font-size: 12px; color: #c9cbd1; display: flex; flex-direction: column; gap: 2px; }
.hp-wins .panel .body p { margin: 0 0 6px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #6f7178; }
.hp-wins .panel .body div { padding: 5px 8px; border-radius: 5px; display: flex; gap: 8px; align-items: center; }
.hp-wins .panel .body div::before { content: ''; width: 10px; height: 10px; border: 1px solid #6f7178; border-radius: 2px; }
.hp-wins .panel .body div.sel { background: rgba(255, 90, 45, .18); color: #fff; }
.hp-wins .panel .body div.sw { font-size: 11px; font-variant-numeric: tabular-nums; color: #9a9ca3; padding: 3px 8px; }
.hp-wins .panel .body div.sw::before { background: var(--c); border: 0; border-radius: 3px; width: 14px; height: 14px; }
.hp-wins .cursor { position: absolute; left: 0; top: 0; z-index: 50; pointer-events: none; will-change: transform; }
.hp-wins .cursor b { position: absolute; left: 14px; top: 16px; white-space: nowrap; font-size: 11px; font-weight: 500; color: #fff; background: var(--accent); padding: 3px 7px; border-radius: 4px 10px 10px 10px; }
@media (max-width: 600px) {
  .hp-wins .win { --bar: 18px; border-radius: 7px; }
  .hp-wins .bar i { width: 6px; height: 6px; } .hp-wins .bar span { font-size: 9px; }
}

/* light theme: light macOS windows, and dissolves/marks multiply onto paper instead of screening onto black */
[data-theme="light"] .hp-layer.out { mix-blend-mode: multiply; }
[data-theme="light"] .hp-wins .win { background: #f6f6f7; border-color: rgba(0, 0, 0, .14); box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 18px 50px -14px rgba(0, 0, 0, .28), 0 4px 14px rgba(0, 0, 0, .08); }
[data-theme="light"] .hp-wins .bar { background: linear-gradient(#ececee, #e2e2e5); border-bottom-color: rgba(0, 0, 0, .12); }
[data-theme="light"] .hp-wins .bar span { color: #5d5f66; }
[data-theme="light"] .hp-wins .body { background: var(--photo) no-repeat, repeating-conic-gradient(#ececef 0 25%, #f7f7f9 0 50%) 0 0 / 16px 16px;
  background-size: calc(970 * var(--u)) calc(1400 * var(--u)), 16px 16px; background-position: calc(var(--x) * var(--u) * -1 - var(--px, 0px)) calc(var(--y) * var(--u) * -1 - var(--py, 0px)), 0 0; }
[data-theme="light"] .hp-wins .panel .body { background: #f6f6f7; color: #2a2a30; }
[data-theme="light"] .hp-wins .panel .body div.sel { color: #16161b; }
[data-theme="light"] .hero-personas .reg svg { mix-blend-mode: multiply; }

/* Visual Strategist: registration marks that drift with the plates */
.hero-personas .reg { position: absolute; width: 28px; height: 28px; color: var(--fg); }
.hero-personas .reg svg { position: absolute; inset: 0; mix-blend-mode: screen; will-change: transform; }
</style>
</head>
<body>
<main>
  <div class="bar" id="bar"></div>
  <p class="note">Sandbox. Edit personas-sandbox.js (engine) and this file (markup, styles). The site does not use these.</p>
  <div id="stage" class="hero-personas" style="--photo: url(me.webp)" aria-hidden="true">
    <div class="hp-layer" data-k="depth"><canvas id="cDepth"></canvas></div>
    <div class="hp-layer" data-k="chladni"><div id="hpPlate" class="hp-plate"><canvas id="cSand"></canvas></div></div>
    <div class="hp-layer" data-k="pencil"><canvas id="cPencil" class="free"></canvas></div>
    <div class="hp-layer" data-k="ascii"><canvas id="cAscii" class="free"></canvas></div>
    <div id="hpWins" class="hp-layer hp-wins" data-k="windows"></div>
    <div class="hp-layer" data-k="cmyk"><canvas id="cCmyk" class="bleed"></canvas><div id="hpRegs"></div></div>
  </div>
</main>
<script type="module">
import { createPersonas, PERSONA_FOR_ROLE } from './personas-sandbox.js'
const engine = await createPersonas({ stage: document.getElementById('stage'), base: '' })
const bar = document.getElementById('bar')
const mk = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.append(b); return b }
const btns = Object.entries(PERSONA_FOR_ROLE).map(([role, key]) => mk(role, () => { engine.show(key); btns.forEach((x) => x.classList.toggle('on', x === btns.find((y) => y.textContent === role))) }))
bar.append(Object.assign(document.createElement('span'), { className: 'sep' }))
mk('Light / dark', () => { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'light' ? 'dark' : 'light' })
btns[0].click()
</script>
</body>
</html>
